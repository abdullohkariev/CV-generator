<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>CV Workshop</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: two panes. Left is a tabbed editor (Content / Design). Right is the CV on a paper sheet that scales to fit, with a page-length readout. The chrome is a cool grey-green workbench; the paper stays white in both themes. */
:root{
  --bg:#E8EBE6;
  --surface:#F6F7F4;
  --surface2:#ECEFEA;
  --line:#CBD1C9;
  --fg:#16201B;
  --muted:#58665E;
  --accent:#17695A;
  --accent-ink:#FFFFFF;
  --accent-soft:#D5E7E1;
  --stage:#D7DCD4;
  --scrim:rgba(20,28,24,.5);
  --danger:#A8322A;
  --warn:#7A4E00;
  --warn-bg:#F6E8C8;
  --ok:#1F6B3A;
  --ok-bg:#D8EBDD;
  --paper:#FFFFFF;
  --paper-ink:#1B1F1D;
  --paper-muted:#5A645E;
  --paper-line:#D9DEDA;
  --ui:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1311;--surface:#161D1A;--surface2:#1D2622;--line:#2C3833;--fg:#E3E9E5;--muted:#94A39B;
    --accent:#5CC4AD;--accent-ink:#08201A;--accent-soft:#1B3A33;--stage:#0A0E0C;--scrim:rgba(0,0,0,.65);
    --danger:#F0897F;--warn:#E8C56A;--warn-bg:#3A3015;--ok:#7FD39A;--ok-bg:#1A3524;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1311;--surface:#161D1A;--surface2:#1D2622;--line:#2C3833;--fg:#E3E9E5;--muted:#94A39B;
  --accent:#5CC4AD;--accent-ink:#08201A;--accent-soft:#1B3A33;--stage:#0A0E0C;--scrim:rgba(0,0,0,.65);
  --danger:#F0897F;--warn:#E8C56A;--warn-bg:#3A3015;--ok:#7FD39A;--ok-bg:#1A3524;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h3{margin:0}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:10px;border-bottom:1px solid var(--line);margin-bottom:16px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;letter-spacing:-.01em;margin-right:auto}
.mark{width:17px;height:21px;background:var(--accent);clip-path:polygon(0 0,68% 0,100% 26%,100% 100%,0 100%)}
.btn{padding:7px 12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;cursor:pointer;font-weight:500;line-height:1.2}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 9px;font-size:13px}
.bar-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.menu{position:relative}
.menu>summary{list-style:none;cursor:pointer;display:inline-block}
.menu>summary::-webkit-details-marker{display:none}
.menu-list{position:absolute;right:0;top:calc(100% + 6px);width:310px;max-height:calc(100vh - 110px);overflow:auto;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px;box-shadow:0 12px 32px rgba(0,0,0,.2);z-index:40;display:flex;flex-direction:column}
.menu-list button{text-align:left;background:none;border:0;padding:8px 10px;border-radius:5px;cursor:pointer}
.menu-list button:hover{background:var(--surface2)}
.menu-list p{margin:4px 10px 6px;font-size:12px;color:var(--muted)}
.menu-list h4{margin:10px 10px 2px;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.menu-list h4:first-child{margin-top:4px}
.menu-list button small{display:block;font-size:12px;color:var(--muted);font-weight:400}
.menu-list button b{font-weight:600}
.bar .viewseg{display:none}

/* work area */
.work{display:grid;grid-template-columns:minmax(330px,430px) minmax(0,1fr);gap:20px;align-items:start;padding-bottom:40px}
.panel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 66px);max-height:calc(100vh - 90px - env(safe-area-inset-top,0px));overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;min-width:0}
.tabs{display:flex;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:3}
.tab{flex:1;padding:11px 8px;font-weight:600;border:0;background:none;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}

.note-bar{background:var(--accent-soft);padding:10px 12px;border-radius:6px;margin:12px 14px 0;font-size:13px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.acc{border-bottom:1px solid var(--line)}
.acc>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;font-weight:600}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary::after{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-left:6px;margin-top:-3px;transition:transform .15s}
.acc[open]>summary::after{transform:rotate(-135deg);margin-top:3px}
.acc>summary .cnt{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:400}
.acc-body{padding:2px 14px 14px;display:flex;flex-direction:column;gap:10px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.02em}
input[type=text],input[type=email],input[type=tel],input[type=url],textarea{width:100%;min-width:0;padding:7px 9px;border:1px solid var(--line);background:var(--bg);border-radius:5px}
textarea{resize:vertical;line-height:1.4}
input:disabled{opacity:.45}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{border:1px solid var(--line);border-radius:6px;background:var(--surface2);padding:10px;display:flex;flex-direction:column;gap:9px}
.card-h{display:flex;align-items:center;gap:8px}
.card-title{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-tools{display:flex;gap:4px}
.ib{width:28px;height:28px;border:1px solid var(--line);background:var(--surface);border-radius:5px;cursor:pointer;line-height:1;padding:0}
.ib:hover:not(:disabled){border-color:var(--muted)}
.ib:disabled{opacity:.35;cursor:default}
.chk{display:flex;align-items:center;gap:7px;font-size:13px}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.hint.warn{color:var(--warn);background:var(--warn-bg);padding:6px 9px;border-radius:5px}
.hint.err{color:var(--danger)}
.photo-row{display:flex;align-items:center;gap:12px}
.pthumb{width:52px;height:52px;border-radius:50%;background:var(--bg);border:1px solid var(--line);overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:12px;flex:none}
.pthumb img{width:100%;height:100%;object-fit:cover}

.group{padding:14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:9px}
.group h3{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.tpl-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tpl{border:1px solid var(--line);border-radius:6px;padding:7px 7px 6px;background:var(--surface2);display:flex;flex-direction:column;gap:5px;align-items:stretch;cursor:pointer;font-size:13px;font-weight:500;text-align:center}
.tpl svg{width:100%;height:auto;display:block;border:1px solid var(--line)}
.tpl[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.swatches{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--fg)}
.hexrow{display:flex;gap:8px;align-items:center}
.hexrow input[type=color]{width:38px;height:32px;padding:0;border:1px solid var(--line);background:var(--bg);border-radius:5px;cursor:pointer}
.hexrow input[type=text]{width:110px;font-family:var(--mono)}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{flex:1;padding:7px 6px;background:var(--surface);border:0;border-right:1px solid var(--line);cursor:pointer;min-width:0;font-weight:500}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.srow{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.srow label{flex:1;display:flex;align-items:center;gap:8px}
.tag{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 5px}

/* preview */
.preview{min-width:0}
.pv-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;font-size:13px}
.pv-bar .lbl{font-weight:600}
.pv-bar .sp{margin-left:auto}
.pill{font-family:var(--mono);font-size:12px;padding:3px 8px;border-radius:4px}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.stagebg{background:var(--stage);border:1px solid var(--line);border-radius:8px;padding:20px}
.stage{width:100%}
.scaler{position:relative;margin-inline:auto}

/* paper (document styles) */
.paper{position:absolute;left:0;top:0;transform-origin:0 0;width:var(--pw);min-height:var(--ph);background:var(--paper);color:var(--paper-ink);font-family:var(--cvfont);font-size:var(--fs);line-height:1.45;box-shadow:0 1px 2px rgba(0,0,0,.14),0 10px 30px rgba(0,0,0,.2);overflow-wrap:break-word}
.paper.breaks::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--ph) - 2px),rgba(214,64,64,.6) calc(var(--ph) - 2px),rgba(214,64,64,.6) var(--ph))}
.paper p,.paper ul,.paper h1,.paper h2{margin:0}
.paper h1{font-size:2.3em;line-height:1.05;font-weight:700;letter-spacing:-.01em}
.paper h1.ph{color:var(--paper-muted);opacity:.5}
.paper .ttl{color:var(--acc);font-weight:600;font-size:1.12em;margin-top:6px}
.paper .contact{display:flex;flex-wrap:wrap;gap:2px 16px;margin-top:10px;color:var(--paper-muted);font-size:.9em}
.paper h2{font-size:.78em;text-transform:uppercase;letter-spacing:.14em;color:var(--acc);font-weight:700}
.paper .sec{margin-top:calc(var(--sp)*20px)}
.paper .sec>h2{margin-bottom:8px}
.paper .sum{white-space:pre-line}
.paper .item{margin-top:calc(var(--sp)*11px)}
.paper .item:first-child{margin-top:0}
.paper .row{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.paper .it-t{font-weight:600}
.paper .when{color:var(--paper-muted);font-size:.88em;white-space:nowrap;font-variant-numeric:tabular-nums}
.paper .loc,.paper .note,.paper .tech{color:var(--paper-muted);font-size:.9em}
.paper .note{margin-top:3px}
.paper .tech{margin-top:2px}
.paper .lnk{color:var(--paper-muted);font-size:.9em}
.paper .bul{margin-top:5px;padding-left:1.15em}
.paper .bul li{margin-top:2px}
.paper .sg{margin-top:calc(var(--sp)*7px)}
.paper .sg:first-child{margin-top:0}
.paper .sg-t{font-weight:600;font-size:.92em}
.paper .sg.chipped .sg-t{display:block;margin-bottom:3px}
.paper .chips{display:flex;flex-wrap:wrap;gap:5px}
.paper .chip{border:1px solid var(--paper-line);border-radius:3px;padding:1px 7px;font-size:.9em}
.paper .lang{display:flex;justify-content:space-between;gap:10px;margin-top:3px}
.paper .lang:first-child{margin-top:0}
.paper .lv{color:var(--paper-muted)}
.paper .photo{width:88px;height:88px;object-fit:cover;flex:none;display:block}
.paper .photo.round{border-radius:50%}
.paper .photo.square{border-radius:3px}

.t-classic{padding:calc(var(--sp)*44px) 52px 52px}
.t-classic .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;padding-bottom:14px;border-bottom:2px solid var(--acc)}
.t-classic .sec>h2{border-bottom:1px solid var(--paper-line);padding-bottom:4px}

.t-sidebar .sb{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:var(--ph)}
.t-sidebar .side{background:var(--acc);color:var(--acc-ink);padding:calc(var(--sp)*40px) 24px;display:flex;flex-direction:column;gap:calc(var(--sp)*18px)}
.t-sidebar .side .sec{margin-top:0}
.t-sidebar .side h2{color:inherit;opacity:.85;border-bottom:1px solid currentColor;padding-bottom:4px}
.t-sidebar .side .photo{width:116px;height:116px}
.t-sidebar .side .chip{border-color:currentColor}
.t-sidebar .side .lv,.t-sidebar .side .when,.t-sidebar .side .loc{color:inherit;opacity:.8}
.t-sidebar .clist div{margin-top:4px;overflow-wrap:anywhere;font-size:.92em}
.t-sidebar .main{padding:calc(var(--sp)*44px) 38px 48px}
.t-sidebar .main .sec:first-of-type{margin-top:calc(var(--sp)*22px)}
.t-sidebar h1{font-size:2.1em}

.t-ledger{padding:calc(var(--sp)*44px) 48px 52px}
.t-ledger .hd{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end;padding-bottom:16px;border-bottom:6px solid var(--acc)}
.t-ledger .hd-l{display:flex;align-items:center;gap:18px}
.t-ledger h1{font-size:2.5em}
.t-ledger .contact{flex-direction:column;align-items:flex-end;margin:0;text-align:right;gap:2px}
.t-ledger .lrow{display:grid;grid-template-columns:124px minmax(0,1fr);gap:20px;margin-top:calc(var(--sp)*14px);padding-top:calc(var(--sp)*14px);border-top:1px solid var(--paper-line)}
.t-ledger .lrow:first-of-type{border-top:0;padding-top:0;margin-top:calc(var(--sp)*20px)}
.t-ledger .lab{padding-top:2px}
.t-ledger .when{font-family:var(--mono);font-size:.82em}

.paper .vid{display:flex;align-items:center;gap:14px}
.paper .vt{min-width:0}
.paper .qr{width:78px;height:78px;flex:none;display:block;border:1px solid var(--paper-line)}
.vplayer{width:100%;max-height:220px;background:#000;border-radius:6px;display:block}
.vmeta{display:flex;align-items:center;gap:8px;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.vmeta span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

/* sheet (import / manual copy) */
.sheet{position:fixed;inset:0;z-index:60;background:var(--scrim);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet-card{width:min(560px,100%);max-height:100%;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:10px}
.sheet-card h3{font-size:16px}
.sheet-card textarea{font-family:var(--mono);font-size:12px;min-height:200px}
.sheet-actions{display:flex;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:6px;font-weight:500;z-index:70;opacity:0;pointer-events:none;transition:opacity .15s;max-width:calc(100vw - 32px)}
.toast.show{opacity:1}
[hidden]{display:none!important}

@media (max-width:900px){
  .bar .viewseg{display:flex;width:100%;order:3}
  .viewseg button{flex:1}
  .work{grid-template-columns:minmax(0,1fr)}
  .panel{position:static;max-height:none;overflow:visible}
  .tabs{position:static}
  .work[data-view="edit"] .preview{display:none}
  .work[data-view="preview"] .panel{display:none}
  .stagebg{padding:10px}
}
@media (max-width:420px){
  .grid2{grid-template-columns:minmax(0,1fr)}
  .tpl-grid{gap:6px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="bar">
  <div class="brand"><span class="mark" aria-hidden="true"></span>CV Workshop</div>
  <div class="bar-actions">
    <button class="btn ghost" id="btnSample" type="button">Load sample</button>
    <button class="btn ghost" id="btnClear" type="button">Clear</button>
    <details class="menu" id="expMenu">
      <summary class="btn primary">Export</summary>
      <div class="menu-list">
        <h4>Save a file</h4>
        <button type="button" data-exp="docx"><b>Word document (.docx)</b><small>Opens in Word and Google Docs</small></button>
        <button type="button" data-exp="pdf"><b>PDF (.pdf)</b><small>Selectable text, clean one-column layout</small></button>
        <button type="button" data-exp="html"><b>Web page (.html)</b><small>Keeps this exact design. Open it and print to PDF</small></button>
        <button type="button" data-exp="md-file">Markdown (.md)</button>
        <button type="button" data-exp="txt-file">Plain text (.txt)</button>
        <h4>Copy to clipboard</h4>
        <button type="button" data-exp="text">Copy plain text</button>
        <button type="button" data-exp="md">Copy Markdown</button>
        <h4>Backup</h4>
        <button type="button" data-exp="json-file">Save backup (.json)</button>
        <button type="button" data-exp="json">Copy backup</button>
        <button type="button" data-exp="import">Import backup…</button>
      </div>
    </details>
  </div>
  <div class="seg viewseg" id="viewSeg" role="group" aria-label="View">
    <button type="button" data-view="edit" aria-pressed="true">Edit</button>
    <button type="button" data-view="preview" aria-pressed="false">Preview</button>
  </div>
</header>

<main class="work" id="work" data-view="edit">
  <aside class="panel" id="panel">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tabC" aria-selected="true" data-tab="content" type="button">Content</button>
      <button class="tab" role="tab" id="tabD" aria-selected="false" data-tab="design" type="button">Design</button>
    </div>
    <div id="paneContent"></div>
    <div id="paneDesign" hidden></div>
  </aside>

  <section class="preview" aria-label="CV preview">
    <div class="pv-bar">
      <span class="lbl" id="pvName">Classic · A4</span>
      <span class="pill ok" id="pvPages">1 page</span>
      <label class="chk sp"><input type="checkbox" id="showBreaks"> Show page breaks</label>
    </div>
    <div class="stagebg">
      <div class="stage" id="stage"><div class="scaler" id="scaler"><article class="paper" id="paper"></article></div></div>
    </div>
  </section>
</main>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h3 id="sheetTitle"></h3>
    <p class="hint" id="sheetNote"></p>
    <textarea id="sheetText" spellcheck="false"></textarea>
    <p class="hint err" id="sheetErr" hidden></p>
    <div class="sheet-actions">
      <button class="btn primary" id="sheetLoad" type="button">Load backup</button>
      <button class="btn" id="sheetFileBtn" type="button">Choose .json file</button>
      <button class="btn ghost" id="sheetClose" type="button">Close</button>
    </div>
    <input type="file" id="sheetFile" accept=".json,application/json" hidden>
  </div>
</div>
<input type="file" id="photoFile" accept="image/*" hidden>
<input type="file" id="videoFile" accept="video/mp4,video/webm" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var uid=function(){return Math.random().toString(36).slice(2,9)};

var KEY='cv-workshop-v1';
var LABELS={summary:'Summary',video:'Video introduction',experience:'Experience',education:'Education',skills:'Skills',projects:'Projects',languages:'Languages',certs:'Certifications'};
var ORDER_KEYS=['summary','video','experience','education','skills','projects','languages','certs'];
var LIST_KEYS=['experience','education','skills','projects','languages','certs'];
var TITLE_FIELDS={experience:['role','company'],education:['degree','school'],skills:['group'],projects:['name'],languages:['name'],certs:['name']};
var NEW_TITLE={experience:'New role',education:'New school',skills:'Skill group',projects:'New project',languages:'New language',certs:'New certification'};
var PRIMARY={experience:['role','company'],education:['school','degree'],skills:['group','items'],projects:['name','desc'],languages:['name'],certs:['name']};
var PAGES={a4:{w:794,h:1123,name:'A4'},letter:{w:816,h:1056,name:'Letter'}};
var SIZES={s:12.5,m:13.5,l:14.5};
var SPACING={t:.75,n:1,a:1.3};
var FONTS={
  plex:{name:'Plex Sans',css:"'IBM Plex Sans', system-ui, sans-serif"},
  serif:{name:'Source Serif',css:"'Source Serif 4', Georgia, serif"},
  dm:{name:'DM Sans',css:"'DM Sans', system-ui, sans-serif"},
  mono:{name:'Plex Mono',css:"'IBM Plex Mono', ui-monospace, monospace"}
};
var TPL={classic:'Classic',sidebar:'Sidebar',ledger:'Ledger'};
var SWATCHES=['#17695A','#2B4A9B','#8C2F39','#2F3A40','#9A5B13','#5B3A8E','#2F6B3A','#B23A62'];
var DEFAULT_DESIGN={template:'classic',accent:'#17695A',font:'plex',size:'m',spacing:'n',page:'a4',photo:true,shape:'round',skills:'chips',breaks:true};
var DEFAULT_VIDEO={url:'',label:'',show:'both',assetId:'',assetName:''};

var BLANK={
  experience:function(){return {id:uid(),role:'',company:'',location:'',start:'',end:'',current:false,bullets:''}},
  education:function(){return {id:uid(),school:'',degree:'',location:'',start:'',end:'',details:''}},
  skills:function(){return {id:uid(),group:'',items:''}},
  projects:function(){return {id:uid(),name:'',link:'',desc:'',tech:''}},
  languages:function(){return {id:uid(),name:'',level:''}},
  certs:function(){return {id:uid(),name:'',issuer:'',year:''}}
};
function blankProfile(){return {name:'',title:'',email:'',phone:'',location:'',website:'',linkedin:'',github:'',summary:'',photo:''}}
function defaultOrder(){return ORDER_KEYS.map(function(k){return {k:k,on:true}})}

function sample(){
  var s={sample:true,profile:{
    name:'Jordan Ellis',title:'Senior Product Designer',email:'jordan.ellis@example.com',phone:'+1 555 0142',location:'Lisbon, Portugal',
    website:'jordanellis.design',linkedin:'linkedin.com/in/jordanellis',github:'',
    summary:'Product designer with 8 years of experience shipping B2B tools used by more than 200,000 people. I take work from research through release and mentor a team of four designers.',
    photo:''},
    experience:[
      {id:uid(),role:'Senior Product Designer',company:'Northwind Labs',location:'Remote',start:'Mar 2022',end:'',current:true,
       bullets:'Redesigned onboarding and raised week-one activation from 41% to 58%.\nBuilt a shared library of 120 components now used by six product teams.\nRan 40+ customer interviews each quarter and turned the findings into the product roadmap.'},
      {id:uid(),role:'Product Designer',company:'Brightpath',location:'Porto',start:'Jun 2018',end:'Feb 2022',current:false,
       bullets:'Led the billing and invoicing redesign, cutting related support tickets by 27%.\nIntroduced weekly design critiques and a handoff review with engineering.'}
    ],
    education:[{id:uid(),school:'Lisbon School of Design',degree:'BA, Communication Design',location:'Lisbon',start:'2012',end:'2016',details:''}],
    skills:[
      {id:uid(),group:'Design',items:'Product design, Interaction design, Prototyping, Design systems, User research'},
      {id:uid(),group:'Tools',items:'Figma, Framer, Miro, Notion, Jira'},
      {id:uid(),group:'Code',items:'HTML, CSS, Basic React'}
    ],
    projects:[
      {id:uid(),name:'Pocket Palette',link:'pocketpalette.app',desc:'Colour contrast checker for designers with 12,000 monthly users.',tech:'Figma, React'}
    ],
    languages:[{id:uid(),name:'English',level:'Fluent'},{id:uid(),name:'Portuguese',level:'Native'}],
    certs:[],
    video:{url:'https://example.com/jordan-intro',label:'Watch my 90-second intro',show:'both',assetId:'',assetName:''},
    design:Object.assign({},DEFAULT_DESIGN,{size:'s'}),
    order:defaultOrder()
  };
  return s;
}

function normalize(o){
  if(!o||typeof o!=='object'||!o.profile||typeof o.profile!=='object') return null;
  var out={sample:!!o.sample,profile:Object.assign(blankProfile(),o.profile)};
  Object.keys(out.profile).forEach(function(k){ if(typeof out.profile[k]!=='string') out.profile[k]=''; });
  if(out.profile.photo && out.profile.photo.indexOf('data:image/')!==0) out.profile.photo='';
  LIST_KEYS.forEach(function(k){
    out[k]=Array.isArray(o[k])?o[k].filter(function(x){return x&&typeof x==='object'}).map(function(x){return Object.assign(BLANK[k](),x)}):[];
  });
  var v=Object.assign({},DEFAULT_VIDEO,(o.video&&typeof o.video==='object')?o.video:{});
  ['url','label','assetId','assetName'].forEach(function(k){ if(typeof v[k]!=='string') v[k]=''; });
  if(['link','qr','both'].indexOf(v.show)<0) v.show='both';
  if(!/^[0-9a-f]{32}$/.test(v.assetId)) v.assetId='';
  out.video=v;
  out.design=Object.assign({},DEFAULT_DESIGN,o.design||{});
  if(!TPL[out.design.template]) out.design.template='classic';
  if(!FONTS[out.design.font]) out.design.font='plex';
  if(!SIZES[out.design.size]) out.design.size='m';
  if(!SPACING[out.design.spacing]) out.design.spacing='n';
  if(!PAGES[out.design.page]) out.design.page='a4';
  if(!/^#[0-9a-fA-F]{6}$/.test(out.design.accent)) out.design.accent=DEFAULT_DESIGN.accent;
  var seen={},ord=[];
  (Array.isArray(o.order)?o.order:[]).forEach(function(x){ if(x&&ORDER_KEYS.indexOf(x.k)>-1&&!seen[x.k]){seen[x.k]=1;ord.push({k:x.k,on:x.on!==false})} });
  ORDER_KEYS.forEach(function(k){
    if(seen[k]) return;
    var at=k==='video'?ord.findIndex(function(x){return x.k==='summary'})+1:ord.length;
    ord.splice(at,0,{k:k,on:true});
  });
  out.order=ord;
  return out;
}
function load(){
  try{ var j=localStorage.getItem(KEY); if(!j) return null; return normalize(JSON.parse(j)); }catch(e){ return null; }
}
var saveT=0;
function persist(){
  clearTimeout(saveT);
  saveT=setTimeout(function(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} },300);
}

var S=load()||sample();

/* ---------- colour helpers ---------- */
function rgb(h){h=h.replace('#','');return [0,2,4].map(function(i){return parseInt(h.substr(i,2),16)})}
function lum(h){var c=rgb(h).map(function(v){v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]}
function inkOn(h){var L=lum(h);return (1.05/(L+.05))>=((L+.05)/.065)?'#FFFFFF':'#14201B'}

/* ---------- content helpers ---------- */
function strip(u){return String(u||'').replace(/^https?:\/\//,'').replace(/\/$/,'')}
function dates(a,b,cur){var e=cur?'Present':b;return [a,e].filter(Boolean).join(' – ')}
function lines(t){return String(t||'').split(/\r?\n/).map(function(l){return l.replace(/^\s*[-•*]\s*/,'').trim()}).filter(Boolean)}
function contactItems(){
  var p=S.profile;
  return [p.email,p.phone,p.location,strip(p.website),strip(p.linkedin),strip(p.github)].filter(function(x){return x&&x.trim()});
}
function nonEmpty(k){return function(it){return PRIMARY[k].some(function(f){return String(it[f]||'').trim()})}}
function has(k){
  if(k==='summary') return !!S.profile.summary.trim();
  if(k==='video') return !!S.video.url.trim();
  return S[k].some(nonEmpty(k));
}
function activeSections(){return S.order.filter(function(o){return o.on&&has(o.k)})}

/* ---------- video link + QR ---------- */
function videoUrl(){
  var u=S.video.url.trim(); if(!u) return '';
  if(/^https?:\/\//i.test(u)) return u;
  return 'https://'+u.replace(/^[a-z][a-z0-9+.-]*:\/\//i,'');
}
function qrModules(u){
  if(!u||typeof qrcode==='undefined') return null;
  try{ var q=qrcode(0,'M'); q.addData(u); q.make(); return q; }catch(e){ return null; }
}
function qrSvg(u){
  var q=qrModules(u); if(!q) return '';
  var n=q.getModuleCount(),d='',r,c,s;
  for(r=0;r<n;r++){
    c=0;
    while(c<n){
      if(q.isDark(r,c)){ s=c; while(c<n&&q.isDark(r,c)) c++; d+='M'+s+' '+r+'h'+(c-s)+'v1h-'+(c-s)+'z'; } else c++;
    }
  }
  return '<svg class="qr" viewBox="-2 -2 '+(n+4)+' '+(n+4)+'" shape-rendering="crispEdges" role="img" aria-label="QR code for the video link"><rect x="-2" y="-2" width="'+(n+4)+'" height="'+(n+4)+'" fill="#fff"/><path d="'+d+'" fill="#1B1F1D"/></svg>';
}

/* ---------- CV rendering ---------- */
function bulletsHTML(t){var l=lines(t);return l.length?'<ul class="bul">'+l.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>':''}
function body(k,side){
  var h='';
  if(k==='summary') return '<p class="sum">'+esc(S.profile.summary.trim())+'</p>';
  if(k==='video'){
    var vd=S.video,mode=vd.show;
    h='<div class="vid">'+(mode!=='link'?qrSvg(videoUrl()):'')+'<div class="vt"><div class="it-t">'+esc(vd.label.trim()||'Watch my video introduction')+'</div>';
    if(mode!=='qr') h+='<div class="lnk">'+esc(strip(vd.url))+'</div>';
    return h+'</div></div>';
  }
  if(k==='experience'){
    S.experience.filter(nonEmpty(k)).forEach(function(e){
      h+='<div class="item"><div class="row"><div><span class="it-t">'+esc(e.role)+'</span>'+(e.company?'<span> · '+esc(e.company)+'</span>':'')+'</div><span class="when">'+esc(dates(e.start,e.end,e.current))+'</span></div>'
        +(e.location?'<div class="loc">'+esc(e.location)+'</div>':'')+bulletsHTML(e.bullets)+'</div>';
    });
    return h;
  }
  if(k==='education'){
    S.education.filter(nonEmpty(k)).forEach(function(e){
      h+='<div class="item"><div class="row"><div><span class="it-t">'+esc(e.degree||e.school)+'</span>'+(e.degree&&e.school?'<span> · '+esc(e.school)+'</span>':'')+'</div><span class="when">'+esc(dates(e.start,e.end,false))+'</span></div>'
        +(e.location?'<div class="loc">'+esc(e.location)+'</div>':'')+(e.details.trim()?'<p class="note">'+esc(e.details.trim())+'</p>':'')+'</div>';
    });
    return h;
  }
  if(k==='skills'){
    var chipped=S.design.skills==='chips';
    S.skills.filter(nonEmpty(k)).forEach(function(g){
      var items=String(g.items||'').split(',').map(function(x){return x.trim()}).filter(Boolean);
      if(chipped){
        h+='<div class="sg chipped">'+(g.group?'<span class="sg-t">'+esc(g.group)+'</span>':'')+'<div class="chips">'+items.map(function(i){return '<span class="chip">'+esc(i)+'</span>'}).join('')+'</div></div>';
      }else{
        h+='<div class="sg">'+(g.group?'<span class="sg-t">'+esc(g.group)+': </span>':'')+'<span>'+esc(items.join(', '))+'</span></div>';
      }
    });
    return h;
  }
  if(k==='projects'){
    S.projects.filter(nonEmpty(k)).forEach(function(p){
      h+='<div class="item"><div class="row"><div><span class="it-t">'+esc(p.name)+'</span>'+(p.link?'<span class="lnk"> · '+esc(strip(p.link))+'</span>':'')+'</div></div>'
        +(p.desc.trim()?'<p class="note">'+esc(p.desc.trim())+'</p>':'')+(p.tech.trim()?'<div class="tech">'+esc(p.tech.trim())+'</div>':'')+'</div>';
    });
    return h;
  }
  if(k==='languages'){
    S.languages.filter(nonEmpty(k)).forEach(function(l){
      h+='<div class="lang"><span>'+esc(l.name)+'</span><span class="lv">'+esc(l.level)+'</span></div>';
    });
    return h;
  }
  if(k==='certs'){
    S.certs.filter(nonEmpty(k)).forEach(function(c){
      h+='<div class="item"><div class="row"><span class="it-t">'+esc(c.name)+'</span><span class="when">'+esc(c.year)+'</span></div>'+(c.issuer?'<div class="loc">'+esc(c.issuer)+'</div>':'')+'</div>';
    });
    return h;
  }
  return h;
}
function nameHTML(){return S.profile.name.trim()?'<h1>'+esc(S.profile.name.trim())+'</h1>':'<h1 class="ph">Your name</h1>'}
function titleHTML(){return S.profile.title.trim()?'<div class="ttl">'+esc(S.profile.title.trim())+'</div>':''}
function photoHTML(){return (S.design.photo&&S.profile.photo)?'<img class="photo '+S.design.shape+'" src="'+S.profile.photo+'" alt="">':''}
function contactSpans(){return contactItems().map(function(c){return '<span>'+esc(c)+'</span>'}).join('')}

var T={
  classic:function(){
    var secs=activeSections().map(function(o){return '<section class="sec"><h2>'+LABELS[o.k]+'</h2>'+body(o.k)+'</section>'}).join('');
    return '<header class="hd"><div class="hd-main">'+nameHTML()+titleHTML()+'<div class="contact">'+contactSpans()+'</div></div>'+photoHTML()+'</header>'+secs;
  },
  sidebar:function(){
    var act=activeSections(),sideKeys=['skills','languages','certs'];
    var ci=contactItems();
    var contact=ci.length?'<section class="sec"><h2>Contact</h2><div class="clist">'+ci.map(function(c){return '<div>'+esc(c)+'</div>'}).join('')+'</div></section>':'';
    var side=act.filter(function(o){return sideKeys.indexOf(o.k)>-1}).map(function(o){return '<section class="sec"><h2>'+LABELS[o.k]+'</h2>'+body(o.k,true)+'</section>'}).join('');
    var main=act.filter(function(o){return sideKeys.indexOf(o.k)<0}).map(function(o){return '<section class="sec"><h2>'+LABELS[o.k]+'</h2>'+body(o.k)+'</section>'}).join('');
    return '<div class="sb"><aside class="side">'+photoHTML()+contact+side+'</aside><div class="main"><header class="hd">'+nameHTML()+titleHTML()+'</header>'+main+'</div></div>';
  },
  ledger:function(){
    var rows=activeSections().map(function(o){return '<section class="lrow"><h2 class="lab">'+LABELS[o.k]+'</h2><div class="lbody">'+body(o.k)+'</div></section>'}).join('');
    return '<header class="hd"><div class="hd-l">'+photoHTML()+'<div>'+nameHTML()+titleHTML()+'</div></div><div class="contact">'+contactSpans()+'</div></header>'+rows;
  }
};

var paper=$('#paper'),scaler=$('#scaler'),stage=$('#stage');
function renderCV(){
  var d=S.design,pg=PAGES[d.page];
  paper.className='paper t-'+d.template+(d.breaks?' breaks':'');
  paper.style.cssText='--acc:'+d.accent+';--acc-ink:'+inkOn(d.accent)+';--cvfont:'+FONTS[d.font].css+';--fs:'+(SIZES[d.size]*(d.font==='mono'?.88:1))+'px;--sp:'+SPACING[d.spacing]+';--pw:'+pg.w+'px;--ph:'+pg.h+'px;';
  paper.innerHTML=T[d.template]();
  fit();
  $('#pvName').textContent=TPL[d.template]+' · '+pg.name;
}
function fit(){
  var pg=PAGES[S.design.page];
  var w=stage.clientWidth||pg.w;
  var sc=Math.min(1,w/pg.w);
  paper.style.transform='scale('+sc+')';
  var h=paper.offsetHeight;
  scaler.style.width=(pg.w*sc)+'px';
  scaler.style.height=(h*sc)+'px';
  var n=h/pg.h,pill=$('#pvPages');
  if(n<=1.005){pill.className='pill ok';pill.textContent='Fits one page';}
  else{pill.className='pill warn';pill.textContent=n.toFixed(1)+' pages · runs onto page '+Math.ceil(n-.005);}
}
var raf=0;
function queue(){
  if(raf) return;
  raf=requestAnimationFrame(function(){raf=0;renderCV();renderSecList();});
}
if(window.ResizeObserver){ new ResizeObserver(function(){fit()}).observe(stage); } else { window.addEventListener('resize',fit); }
if(document.fonts&&document.fonts.addEventListener){ document.fonts.addEventListener('loadingdone',function(){fit()}); }

/* ---------- editor: content ---------- */
var paneC=$('#paneContent'),paneD=$('#paneDesign'),panel=$('#panel');
var openSet={profile:1,experience:1};
function fld(label,sec,i,f,val,opts){
  opts=opts||{};
  var at='data-sec="'+sec+'"'+(i!=null?' data-i="'+i+'"':'')+' data-f="'+f+'"';
  if(opts.area) return '<label class="fld"><span>'+label+'</span><textarea rows="'+(opts.rows||3)+'" '+at+' placeholder="'+esc(opts.ph||'')+'">'+esc(val)+'</textarea></label>';
  return '<label class="fld"><span>'+label+'</span><input type="'+(opts.type||'text')+'" '+at+' value="'+esc(val)+'" placeholder="'+esc(opts.ph||'')+'" autocomplete="off"'+(opts.disabled?' disabled':'')+'></label>';
}
function cardTitle(sec,it){
  var t=TITLE_FIELDS[sec].map(function(f){return String(it[f]||'').trim()}).filter(Boolean).join(' · ');
  return t||NEW_TITLE[sec];
}
function fieldsFor(sec,i,it){
  if(sec==='experience') return '<div class="grid2">'+fld('Role',sec,i,'role',it.role,{ph:'Product Designer'})+fld('Company',sec,i,'company',it.company)+'</div>'
    +fld('Location',sec,i,'location',it.location)
    +'<div class="grid2">'+fld('Start',sec,i,'start',it.start,{ph:'Mar 2022'})+fld('End',sec,i,'end',it.end,{ph:'Feb 2024',disabled:it.current})+'</div>'
    +'<label class="chk"><input type="checkbox" data-sec="'+sec+'" data-i="'+i+'" data-f="current"'+(it.current?' checked':'')+'> I still work here</label>'
    +fld('Achievements (one per line)',sec,i,'bullets',it.bullets,{area:1,rows:4,ph:'Cut onboarding time from 9 to 4 minutes'});
  if(sec==='education') return '<div class="grid2">'+fld('Degree',sec,i,'degree',it.degree)+fld('School',sec,i,'school',it.school)+'</div>'
    +fld('Location',sec,i,'location',it.location)
    +'<div class="grid2">'+fld('Start',sec,i,'start',it.start)+fld('End',sec,i,'end',it.end)+'</div>'
    +fld('Details',sec,i,'details',it.details,{area:1,rows:2});
  if(sec==='skills') return fld('Group',sec,i,'group',it.group,{ph:'Tools'})+fld('Skills (comma separated)',sec,i,'items',it.items,{area:1,rows:2,ph:'Figma, Notion, Jira'});
  if(sec==='projects') return '<div class="grid2">'+fld('Name',sec,i,'name',it.name)+fld('Link',sec,i,'link',it.link)+'</div>'
    +fld('Description',sec,i,'desc',it.desc,{area:1,rows:2})+fld('Tech or tools',sec,i,'tech',it.tech);
  if(sec==='languages') return '<div class="grid2">'+fld('Language',sec,i,'name',it.name)+fld('Level',sec,i,'level',it.level,{ph:'Fluent'})+'</div>';
  if(sec==='certs') return '<div class="grid2">'+fld('Certification',sec,i,'name',it.name)+fld('Issuer',sec,i,'issuer',it.issuer)+'</div>'+fld('Year',sec,i,'year',it.year);
  return '';
}
function cardHTML(sec,i,it,n){
  return '<div class="card" data-sec="'+sec+'" data-i="'+i+'"><div class="card-h"><span class="card-title">'+esc(cardTitle(sec,it))+'</span><span class="card-tools">'
    +'<button class="ib" type="button" data-act="up" aria-label="Move up"'+(i===0?' disabled':'')+'>↑</button>'
    +'<button class="ib" type="button" data-act="down" aria-label="Move down"'+(i===n-1?' disabled':'')+'>↓</button>'
    +'<button class="ib" type="button" data-act="del" aria-label="Remove">×</button></span></div>'+fieldsFor(sec,i,it)+'</div>';
}
function acc(key,title,count,inner){
  return '<details class="acc" data-key="'+key+'"'+(openSet[key]?' open':'')+'><summary><span>'+title+'</span><span class="cnt">'+count+'</span></summary><div class="acc-body">'+inner+'</div></details>';
}
var ADD_LABEL={experience:'Add role',education:'Add education',skills:'Add skill group',projects:'Add project',languages:'Add language',certs:'Add certification'};
function renderContent(){
  var p=S.profile,h='';
  if(S.sample) h+='<div class="note-bar"><span>This is example content. Replace it with your own details.</span><button class="btn sm" type="button" data-act="clear">Clear all</button></div>';
  h+=acc('profile','Profile','',
    '<div class="photo-row"><div class="pthumb">'+(p.photo?'<img src="'+p.photo+'" alt="">':'Photo')+'</div><div><button class="btn sm" type="button" data-act="photo">Upload photo</button> '+(p.photo?'<button class="btn sm ghost" type="button" data-act="photo-del">Remove</button>':'')+'</div></div>'
    +'<div class="grid2">'+fld('Full name','profile',null,'name',p.name)+fld('Job title','profile',null,'title',p.title)+'</div>'
    +'<div class="grid2">'+fld('Email','profile',null,'email',p.email,{type:'email'})+fld('Phone','profile',null,'phone',p.phone,{type:'tel'})+'</div>'
    +fld('Location','profile',null,'location',p.location)
    +'<div class="grid2">'+fld('Website','profile',null,'website',p.website)+fld('LinkedIn','profile',null,'linkedin',p.linkedin)+'</div>'
    +fld('GitHub','profile',null,'github',p.github));
  h+=acc('summary','Summary','',fld('Two to four sentences','profile',null,'summary',p.summary,{area:1,rows:5,ph:'Who you are, what you do best, and what you want next.'}));
  h+=acc('video','Video introduction',S.video.url.trim()?'link added':'',videoPane());
  LIST_KEYS.forEach(function(k){
    var n=S[k].length;

var toastT=0;
function toast(msg){
  var t=$('#toast'); t.textContent=msg; t.classList.add('show');

}
var armedBtn=null,armT=0;
function arm(btn,label,fn){
  if(armedBtn===btn){ clearTimeout(armT); armedBtn=null; fn(); return; }
  if(armedBtn&&armedBtn.isConnected&&armedBtn.dataset.orig) armedBtn.textContent=armedBtn.dataset.orig;
  armedBtn=btn; btn.dataset.orig=btn.textContent; btn.textContent=label;
  clearTimeout(armT);
  armT=setTimeout(function(){ if(btn.isConnected) btn.textContent=btn.dataset.orig; armedBtn=null; },3000);
}

/* ---------- export / import ---------- */
function exportText(md){
  var p=S.profile,o=[];
  var H1=function(t){return md?'# '+t:t.toUpperCase()},H2=function(t){return md?'## '+t:t.toUpperCase()};
  var B=function(t){return md?'**'+t+'**':t};
  o.push(H1(p.name.trim()||'Your name'));
  if(p.title.trim()) o.push(md?'**'+p.title.trim()+'**':p.title.trim());
  var c=contactItems(); if(c.length) o.push(c.join(' | '));
  activeSections().forEach(function(sec){
    o.push('',H2(LABELS[sec.k]));
    var k=sec.k;
    if(k==='summary') o.push(p.summary.trim());
    if(k==='video') o.push((S.video.label.trim()||'Video introduction')+': '+videoUrl());
    if(k==='experience') S.experience.filter(nonEmpty(k)).forEach(function(e,i){
      if(i) o.push('');
      var d=dates(e.start,e.end,e.current);
      o.push(B([e.role,e.company].filter(Boolean).join(', '))+(e.location?' ('+e.location+')':'')+(d?' | '+d:''));
      lines(e.bullets).forEach(function(b){o.push('- '+b)});
    });
    if(k==='education') S.education.filter(nonEmpty(k)).forEach(function(e,i){
      if(i) o.push('');
      var d=dates(e.start,e.end,false);
      o.push(B([e.degree,e.school].filter(Boolean).join(', '))+(e.location?' ('+e.location+')':'')+(d?' | '+d:''));
      if(e.details.trim()) o.push(e.details.trim());
    });
    if(k==='skills') S.skills.filter(nonEmpty(k)).forEach(function(g){
      var it=String(g.items||'').split(',').map(function(x){return x.trim()}).filter(Boolean).join(', ');
      o.push((g.group?g.group+': ':'')+it);
    });
    if(k==='projects') S.projects.filter(nonEmpty(k)).forEach(function(q,i){
      if(i) o.push('');
      o.push(B(q.name)+(q.link?' ('+strip(q.link)+')':''));
      if(q.desc.trim()) o.push(q.desc.trim());
      if(q.tech.trim()) o.push('Tech: '+q.tech.trim());
    });
    if(k==='languages') S.languages.filter(nonEmpty(k)).forEach(function(l){o.push(l.name+(l.level?': '+l.level:''))});
    if(k==='certs') S.certs.filter(nonEmpty(k)).forEach(function(q){o.push([q.name,q.issuer,q.year].filter(Boolean).join(', '))});
  });
  return o.join('\n')+'\n';
}

var fontCache={};
function loadFont(file){
  if(!fontCache[file]){
    fontCache[file]=fetch('fonts/'+file).then(function(r){
      if(!r.ok) throw new Error('font');
      return r.arrayBuffer();
    }).then(function(buf){
      var u=new Uint8Array(buf),s='',i,CH=0x8000;
      for(i=0;i<u.length;i+=CH) s+=String.fromCharCode.apply(null,u.subarray(i,i+CH));
      return s;
    }).catch(function(e){ delete fontCache[file]; throw e; });
  }
  return fontCache[file];
}

  return '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc((S.profile.name.trim()||'CV')+' – CV')+'</title>'
    +'<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:wght@400;600;700&family=DM+Sans:wght@400;500;600;700&display=swap">'
    +'<style>:root{--paper:#fff;--paper-ink:#1B1F1D;--paper-muted:#5A645E;--paper-line:#D9DEDA;--mono:\'IBM Plex Mono\',ui-monospace,monospace}*{box-sizing:border-box}body{margin:0;background:#E8EBE6;padding:24px 12px;overflow-x:auto}'
    +css+'.paper{position:relative!important;transform:none!important;margin:0 auto;box-shadow:0 2px 20px rgba(0,0,0,.18)}@page{size:'+pg+';margin:0}@media print{body{background:none;padding:0}.paper{box-shadow:none;margin:0}}</style></head><body><article class="paper t-'+S.design.template+'" style="'+esc(paper.style.cssText)+'">'+paper.innerHTML+'</article></body></html>';
}

var exporting=false;
$('#expMenu').addEventListener('click',function(e){
  var b=e.target.closest('[data-exp]'); if(!b) return;
  var k=b.dataset.exp,base=fileBase(); $('#expMenu').open=false;
  if(k==='text') return copyText(exportText(false),'Plain text');
  if(k==='md') return copyText(exportText(true),'Markdown');
  if(k==='json') return copyText(JSON.stringify(S),'Backup');
  if(k==='import') return openSheet('import');
  var txt;
  if(k==='txt-file'){ txt=exportText(false); return saveFile(base+'.txt',txt,txt); }
  if(k==='md-file'){ txt=exportText(true); return saveFile(base+'.md',txt,txt); }
  if(k==='json-file'){ txt=JSON.stringify(S); return saveFile(base+'-backup.json',txt,txt); }
  if(k==='html'){ txt=buildHTML(); return saveFile(base+'.html',txt,txt); }
  if(k==='docx'||k==='pdf'){
    if(exporting) return;
    exporting=true; toast('Preparing your '+(k==='pdf'?'PDF':'Word file')+'…');
    (k==='pdf'?buildPdf():buildDocx()).then(function(blob){
      exporting=false; saveFile(base+'.'+k,blob,null);
    },function(err){
      exporting=false;
      toast(err&&err.message==='lib'?'A needed library did not load. Reload the page and try again.':'Could not build the file. Try again.');
      if(window.console) console.error(err);
    });
  }
});
document.addEventListener('click',function(e){ var m=$('#expMenu'); if(m.open&&!m.contains(e.target)) m.open=false; });
$('#sheetClose').addEventListener('click',closeSheet);
$('#sheet').addEventListener('click',function(e){ if(e.target===e.currentTarget) closeSheet(); });
document.addEventListener('keydown',function(e){ if(e.key==='Escape'){ if(!$('#sheet').hidden) closeSheet(); else $('#expMenu').open=false; } });
$('#sheetLoad').addEventListener('click',function(){ importJSON($('#sheetText').value) });
$('#sheetFileBtn').addEventListener('click',function(){ $('#sheetFile').click() });
$('#sheetFile').addEventListener('change',function(e){
  var f=e.target.files&&e.target.files[0]; e.target.value=''; if(!f) return;
  var fr=new FileReader(); fr.onload=function(){ importJSON(String(fr.result)) }; fr.readAsText(f);
});

/* ---------- start ---------- */
renderContent(); buildDesign(); syncDesign(); renderSecList(); renderCV();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(function(){fit()});
})();
</script>
